{% extends 'main/layout.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="features">
    <h1>Удаление статьи: {{ object.title }}</h1>
    <p>Вы уверены, что хотите удалить эту статью?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Да, удалить</button>
        <a href="{% url 'news-detail' object.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
